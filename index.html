<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #111;
    }

    .game-container {
      position: relative;
      width: min(800px, 100vw);
      aspect-ratio: 4 / 3;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      image-rendering: pixelated;
    }

    .restart-button {
      position: absolute;
      top: calc(50% + 62px);
      left: 50%;
      z-index: 1;
      min-height: 42px;
      padding: 8px 20px;
      transform: translateX(-50%);
      border: 2px solid #39ff14;
      background: #111;
      color: #39ff14;
      font: bold 16px monospace;
      cursor: pointer;
    }

    .restart-button:hover,
    .restart-button:focus-visible {
      background: #39ff14;
      color: #000;
    }

    .restart-button[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="game-container">
    <canvas id="game" width="800" height="600" tabindex="0" aria-label="Space Invaders game canvas"></canvas>
    <button id="restart-button" class="restart-button" type="button" hidden>Restart</button>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const restartButton = document.querySelector("#restart-button");
    const ctx = canvas.getContext("2d");
    const keys = new Set();

    const player = {
      width: 32,
      height: 32,
      x: (canvas.width - 32) / 2,
      y: canvas.height - 50,
      speed: 360,
      lives: 3,
      invulnerableUntil: 0,
      nextShotAt: 0
    };

    // Pixel-perfect recreation of the supplied yellow upside-down heart ship.
    // Each 1 is a solid square pixel, so the sprite stays sharp when drawn.
    const playerSprite = [
      "0000001111000000",
      "0000001111000000",
      "0000111111110000",
      "0000111111110000",
      "0011111111111100",
      "0011111111111100",
      "1111111111111111",
      "1111111111111111",
      "1111111111111111",
      "1111111111111111",
      "1111111111111111",
      "1111111111111111",
      "1111111001111111",
      "1111111001111111",
      "0111110000111110",
      "0011000000001100"
    ];
    const playerPixelSize = 2;
    const playerColor = "#ffff00";

    const invaderSprites = {
      squid: [
        "00100100",
        "00011000",
        "00111100",
        "01111110",
        "11011011",
        "11111111",
        "10100101",
        "00100100"
      ],
      crab: [
        "00011000",
        "00111100",
        "01111110",
        "11011011",
        "11111111",
        "00100100",
        "01011010",
        "10100101"
      ],
      octopus: [
        "00111100",
        "01111110",
        "11111111",
        "11011011",
        "11111111",
        "00100100",
        "01011010",
        "11000011"
      ]
    };

    const invaderPixelSize = 4;
    const invaderSize = invaderPixelSize * 8;
    const invaderColumnGap = 18;
    const invaderRowGap = 14;
    const invaders = {
      columns: 11,
      rows: [
        { sprite: "squid", color: "#ffff00" }, // yellow
        { sprite: "crab", color: "#ff69b4" },  // pink
        { sprite: "crab", color: "#b266ff" },  // purple
        { sprite: "octopus", color: "#ffffff" }, // white
        { sprite: "octopus", color: "#ff69b4" } // pink
      ],
      x: 0,
      y: 64,
      direction: 1,
      speed: 60,
      edgeMargin: 16,
      stepDown: 12
    };
    const formationWidth =
      invaders.columns * invaderSize +
      (invaders.columns - 1) * invaderColumnGap;
    invaders.x = (canvas.width - formationWidth) / 2;

    const enemies = [];
    invaders.rows.forEach((row, rowIndex) => {
      for (let column = 0; column < invaders.columns; column += 1) {
        enemies.push({ rowIndex, column, alive: true });
      }
    });

    // Low, wide shields: 30 px high by 100 px wide (3:10 ratio).
    const barrierWidth = 100;
    const barrierHeight = 20;
    const barrierColor = "#247a32";
    const barrierGap = (canvas.width - 4 * barrierWidth) / 5;
    const barriers = Array.from({ length: 4 }, (_, index) => ({
      x: barrierGap + index * (barrierWidth + barrierGap),
      y: 448,
      width: barrierWidth,
      height: barrierHeight
    }));

    const playerBullets = [];
    const enemyBullets = [];
    const maxEnemyBullets = 5;
    const playerBulletSpeed = 520;
    const maxPlayerBullets = 6;
    const playerShotCooldown = 180; // milliseconds between shots while holding Space
    const enemyBulletSpeed = 230;
    let gameState = "playing";
    let currentTime = 0;
    let nextEnemyShotAt = 900 + Math.random() * 600;
    let previousTime = null;

    window.addEventListener("keydown", (event) => {
      if (event.code === "Enter" && gameState !== "playing") {
        event.preventDefault();
        restartGame();
        return;
      }

      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        keys.add(event.key);
      } else if (event.code === "Space" || event.key === " ") {
        event.preventDefault();
        keys.add("Space");
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key);
      if (event.code === "Space" || event.key === " ") {
        keys.delete("Space");
      }
    });

    window.addEventListener("blur", () => {
      keys.clear();
    });

    restartButton.addEventListener("click", restartGame);

    function drawPlayer() {
      if (
        currentTime < player.invulnerableUntil &&
        Math.floor(currentTime / 100) % 2 === 0
      ) {
        return;
      }

      ctx.fillStyle = playerColor;
      playerSprite.forEach((pixelRow, pixelY) => {
        for (let pixelX = 0; pixelX < pixelRow.length; pixelX += 1) {
          if (pixelRow[pixelX] === "1") {
            ctx.fillRect(
              Math.round(player.x + pixelX * playerPixelSize),
              Math.round(player.y + pixelY * playerPixelSize),
              playerPixelSize,
              playerPixelSize
            );
          }
        }
      });
    }

    function drawInvaders() {
      enemies.forEach((enemy) => {
        if (!enemy.alive) {
          return;
        }

        const row = invaders.rows[enemy.rowIndex];
        const sprite = invaderSprites[row.sprite];
        ctx.fillStyle = row.color;

        const x = invaders.x + enemy.column * (invaderSize + invaderColumnGap);
        const y = invaders.y + enemy.rowIndex * (invaderSize + invaderRowGap);

        sprite.forEach((pixelRow, pixelY) => {
          for (let pixelX = 0; pixelX < pixelRow.length; pixelX += 1) {
            if (pixelRow[pixelX] === "1") {
              ctx.fillRect(
                x + pixelX * invaderPixelSize,
                y + pixelY * invaderPixelSize,
                invaderPixelSize,
                invaderPixelSize
              );
            }
          }
        });
      });
    }

    function drawBarriers() {
      ctx.fillStyle = barrierColor;
      barriers.forEach((barrier) => {
        ctx.fillRect(barrier.x, barrier.y, barrier.width, barrier.height);
      });
    }

    function drawBullets() {
      ctx.fillStyle = playerColor;
      playerBullets.forEach((bullet) => {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      });

      ctx.fillStyle = "#ff4040";
      enemyBullets.forEach((bullet) => {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      });
    }

    function drawHud() {
      ctx.fillStyle = "#ffffff";
      ctx.font = "16px monospace";
      ctx.textAlign = "start";
      ctx.textBaseline = "top";
      ctx.fillText(`LIVES: ${player.lives}`, 20, 16);
      ctx.fillText("ARROWS: MOVE  SPACE: FIRE", canvas.width - 290, 16);

      if (gameState !== "playing") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 36px monospace";
        const title = gameState === "won" ? "YOU WIN!" : "GAME OVER";
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "18px monospace";
        ctx.fillText("Press Enter or click Restart", canvas.width / 2, canvas.height / 2 + 24);
        ctx.textAlign = "start";
      }

      ctx.fillStyle = "#ffffff";
      ctx.font = "16px monospace";
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillText("Name: C240 - Josh Chan", canvas.width - 16, canvas.height - 12);
      ctx.textAlign = "start";
      ctx.textBaseline = "top";
    }

    function rectanglesOverlap(first, second) {
      return (
        first.x < second.x + second.width &&
        first.x + first.width > second.x &&
        first.y < second.y + second.height &&
        first.y + first.height > second.y
      );
    }

    function getEnemyBounds(enemy) {
      return {
        x: invaders.x + enemy.column * (invaderSize + invaderColumnGap),
        y: invaders.y + enemy.rowIndex * (invaderSize + invaderRowGap),
        width: invaderSize,
        height: invaderSize
      };
    }

    // Both enemy and player projectiles are stopped by a shield.
    function bulletHitsBarrier(bullet) {
      return barriers.some((barrier) => rectanglesOverlap(bullet, barrier));
    }

    function firePlayerBullet(time) {
      if (
        keys.has("Space") &&
        playerBullets.length < maxPlayerBullets &&
        time >= player.nextShotAt
      ) {
        playerBullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y - 12,
          width: 4,
          height: 12,
          speed: playerBulletSpeed
        });
        player.nextShotAt = time + playerShotCooldown;
      }
    }

    function fireEnemyBullet(time) {
      if (time < nextEnemyShotAt) {
        return;
      }

      nextEnemyShotAt = time + 700 + Math.random() * 900;
      const activeEnemies = enemies.filter((enemy) => enemy.alive);
      if (activeEnemies.length === 0 || enemyBullets.length >= maxEnemyBullets) {
        return;
      }

      const shooter = activeEnemies[Math.floor(Math.random() * activeEnemies.length)];
      const bounds = getEnemyBounds(shooter);
      enemyBullets.push({
        x: bounds.x + bounds.width / 2 - 2,
        y: bounds.y + bounds.height,
        width: 4,
        height: 10,
        speed: enemyBulletSpeed
      });
    }

    function endGame(result = "gameover") {
      gameState = result;
      playerBullets.length = 0;
      enemyBullets.length = 0;
      keys.clear();
      restartButton.hidden = false;
      restartButton.focus();
    }

    function updateProjectiles(deltaTime, time) {
      for (let index = playerBullets.length - 1; index >= 0; index -= 1) {
        const bullet = playerBullets[index];
        bullet.y -= bullet.speed * deltaTime;

        if (bulletHitsBarrier(bullet)) {
          playerBullets.splice(index, 1);
          continue;
        }

        const hitEnemy = enemies.find((enemy) =>
          enemy.alive && rectanglesOverlap(bullet, getEnemyBounds(enemy))
        );
        if (hitEnemy) {
          hitEnemy.alive = false;
          playerBullets.splice(index, 1);
        } else if (bullet.y + bullet.height < 0) {
          playerBullets.splice(index, 1);
        }
      }

      if (enemies.every((enemy) => !enemy.alive)) {
        endGame("won");
        return;
      }

      for (let index = enemyBullets.length - 1; index >= 0; index -= 1) {
        const bullet = enemyBullets[index];
        bullet.y += bullet.speed * deltaTime;

        if (bulletHitsBarrier(bullet)) {
          enemyBullets.splice(index, 1);
        } else if (rectanglesOverlap(bullet, player)) {
          enemyBullets.splice(index, 1);
          if (time >= player.invulnerableUntil) {
            player.lives -= 1;
            player.invulnerableUntil = time + 1000;
            if (player.lives === 0) {
              endGame();
              return;
            }
          }
        } else if (bullet.y > canvas.height) {
          enemyBullets.splice(index, 1);
        }
      }
    }

    function restartGame() {
      player.x = (canvas.width - player.width) / 2;
      player.lives = 3;
      player.invulnerableUntil = 0;
      player.nextShotAt = currentTime;
      invaders.x = (canvas.width - formationWidth) / 2;
      invaders.y = 64;
      invaders.direction = 1;
      enemies.forEach((enemy) => {
        enemy.alive = true;
      });
      playerBullets.length = 0;
      enemyBullets.length = 0;
      nextEnemyShotAt = currentTime + 900 + Math.random() * 600;
      gameState = "playing";
      keys.clear();
      restartButton.hidden = true;
      canvas.focus();
    }

    function gameLoop(time) {
      const deltaTime = previousTime === null
        ? 0
        : Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;
      currentTime = time;

      if (gameState === "playing") {
        if (keys.has("ArrowLeft")) {
          player.x -= player.speed * deltaTime;
        }
        if (keys.has("ArrowRight")) {
          player.x += player.speed * deltaTime;
        }

        player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
        invaders.x += invaders.direction * invaders.speed * deltaTime;

        if (invaders.x <= invaders.edgeMargin) {
          invaders.x = invaders.edgeMargin;
          invaders.direction = 1;
          invaders.y += invaders.stepDown;
        } else if (invaders.x + formationWidth >= canvas.width - invaders.edgeMargin) {
          invaders.x = canvas.width - invaders.edgeMargin - formationWidth;
          invaders.direction = -1;
          invaders.y += invaders.stepDown;
        }

        firePlayerBullet(time);
        fireEnemyBullet(time);
        updateProjectiles(deltaTime, time);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawInvaders();
      drawBarriers();
      drawBullets();
      drawPlayer();
      drawHud();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
